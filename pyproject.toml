[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superwireless"
version = "0.1.0"
description = "给 Agent 用的无线仿真信道供应站：标准化信道实例与物理测量量的 MCP 服务"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "structlog>=23.0",
    # 1.x 与 2.x 都支持。2.0 把 mcp.server.fastmcp.FastMCP 挪成了
    # mcp.server.mcpserver.MCPServer 并删掉了旧模块，server.py 里做了兼容导入。
    "mcp>=1.0",
]

[project.optional-dependencies]
rt = ["sionna-rt"]          # Phase 2 射线追踪，会连带装 mitsuba + drjit
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
superwireless-mcp = "superwireless.server:main"

[tool.setuptools.packages.find]
where = ["src"]

# 内联 KaTeX 资产（CSS 含 20 个 base64 字体 + JS，合计约 628 KB）。
# **不带上它说明书里的公式会退回 MathML**——不报错、只是没那么好看，
# 所以打包漏了很难发现。scripts/vendor_katex.py 负责生成，不手改。
[tool.setuptools.package-data]
superwireless = ["assets/*.css", "assets/*.js", "assets/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
