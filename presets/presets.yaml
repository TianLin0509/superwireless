# ===========================================================================
# 高铁沿线（linear 拓扑）
# ===========================================================================
# ChannelHub 的 topology_layout: linear 把站点沿一条直线轨道**两侧交错**摆放，
# track_offset_m 是站点到轨道的垂距，isd_m 沿轨道量。
# mobility_mode 为 linear/track 时进入高铁模式：UE 在车厢内按
# train_length_m x train_width_m 撒点，整列车沿轨道移动，
# train_penetration_loss_db 是车体穿透损耗。
#
# **这不是 38.104 HST-SFN 的一致性测试配置**（那套用 D_s=580 m、D_min=5 m、
# 单频网合并），只是一个参数取值合理的高铁沿线场景。

hst_350kmh:
  group: 高铁
  label: 高铁沿线 · 350 km/h · 车体穿透 20 dB
  summary: 站点沿轨道两侧交错、间距 580 m、垂距 30 m。UE 在 400 m 长的车厢内撒点，
    整列车 350 km/h 移动。车体穿透损耗 20 dB 是高铁场景与普通高速移动最大的区别——
    它把链路预算整体压低 20 dB，很多在开阔地成立的结论到车厢里就不成立了。
  typical_for: [高铁, 切换, 多普勒补偿, 车体穿透, 沿线覆盖]
  verify: sw_probe_scenario 看多普勒中位数与路损；路损应明显高于同距离的开阔场景
  caveat: 不是 38.104 HST-SFN 一致性配置（那套是单频网合并）。
    穿透损耗是配置项不是模型，改 train_penetration_loss_db 直接平移路损。
