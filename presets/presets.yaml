# ===========================================================================
# 干扰场景
# ===========================================================================
# 用 IoT（噪声抬升，(I+N)/N）刻画干扰强度，20 dB 以上算高干扰。
# 生成后用 sw_interference_report 复核，别用配置意图代替实测。
#
# **哪些旋钮真的能动 IoT，是按 ChannelHub 几何模型实测过的**，
# 不是照搬教科书直觉——细节见 interference.py 与 SCENARIOS.md。

high_iot_dense:
  group: 干扰场景
  label: 高干扰 · 密集城区 21 小区 · ISD 150 m
  summary: 密集城区微站，站间距 150 m，21 个小区互相干扰。发射功率走 UMi 的
    33 dBm 默认值——**不要为了凑高 IoT 去堆 46 dBm**，那是宏站功率，
    配 150 m 站距在物理上讲不通（实测会把 IoT 推到 48.8 dB，等效负载 0.99999）。
  typical_for: [干扰抑制, 干扰协调, 链路自适应鲁棒性, 边缘用户]
  verify: sw_probe_scenario 看 interference.dl_iot.median_db，应落在高干扰档
  expect:   # 实测，63 样本 · sw_probe_scenario
    cells: 21
    iot_dl_db: 35.76      # 极高干扰
    iot_ul_db: 2.89
    sinr_db: 13.01
    sir_db: 13.01
    pathloss_db: 86.78
    distance_m: 70.51
    los_ratio: 0.587
    doppler_hz: 9.72
    snr_clamped_out: 3   # 探测口径下撞 +50 dB 夹逼，SNR 分布已剔除这些样本
    ms_per_sample: 847
  config:
    source: internal_sim
    scenario: UMi_NLOS
    channel_model: CDL-C
    num_sites: 7
    sectors_per_site: 3
    isd_m: 150.0
    num_ues: 21
    num_interfering_ues: 16
    num_bs_tx_ant: 64
    num_bs_rx_ant: 64
    num_ue_tx_ant: 4
    num_ue_rx_ant: 4
    bandwidth_hz: 100000000.0
    subcarrier_spacing: 30000
    carrier_freq_hz: 3500000000.0
    link: DL
    channel_est_mode: ls_linear

low_iot_reference:
  group: 干扰场景
  label: 去邻站对照 · 同小区尺寸（SNR 对齐的干扰消融）
  summary: high_iot_dense 的干净对照：**只改一件事——把 7 站减成 1 站**。
    小区半径、功率、天线、频点全部不变。实测两组 SNR 中位数 30.5 vs 29.4 dB
    （只差 1.1 dB），IoT 20.3 vs 35.8 dB（差 15.5 dB）——**变量分离得很干净**。
    作为对照：早先那版用 ISD 800 m 拉低干扰，两组 SNR 差了 45 dB，根本不是同一个工况。
    注意剩下的 2 个同站扇区仍会互扰，IoT 不归零，20.3 dB 按现场口径**仍算高干扰**。
  typical_for: [干扰场景对照, 消融实验]
  verify: 与 high_iot_dense 并排 sw_compare_scenarios，看 IoT 拉开而 SNR 基本齐平
  caveat: 在这套模型里 **IoT 与 SNR 无法完全解耦** —— 两者都含热噪声 N。
    靠拉大站间距来降 IoT 会同时把 SNR 拉低（实测 ISD 800 m 时 SNR 中位数 -5.9 dB），
    那样的"对照组"混了两个变量。减站数是能想到的最干净的做法。
  expect:   # 实测，63 样本 · sw_probe_scenario
    cells: 3
    iot_dl_db: 20.31      # 高干扰
    iot_ul_db: 16.71
    sinr_db: 26.95
    sir_db: 28.81
    pathloss_db: 83.76
    distance_m: 65.35
    los_ratio: 0.556
    doppler_hz: 9.72
    snr_clamped_out: 8   # 探测口径下撞 +50 dB 夹逼，SNR 分布已剔除这些样本
    ms_per_sample: 345
  config:
    source: internal_sim
    scenario: UMi_NLOS
    channel_model: CDL-C
    num_sites: 1
    sectors_per_site: 3
    isd_m: 150.0
    num_ues: 21
    num_interfering_ues: 16
    num_bs_tx_ant: 64
    num_bs_rx_ant: 64
    num_ue_tx_ant: 4
    num_ue_rx_ant: 4
    bandwidth_hz: 100000000.0
    subcarrier_spacing: 30000
    carrier_freq_hz: 3500000000.0
    link: DL
    channel_est_mode: ls_linear

high_iot_uplink:
  group: 干扰场景
  label: 上行高干扰 · 邻区满调度
  summary: 上行 IoT 是干扰抬升的经典口径（基站侧噪声抬升）。邻区每小区多个 UE 满负载同发。
  typical_for: [上行干扰, 功控, 上行调度, 接收机算法]
