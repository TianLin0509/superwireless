    sinr_db: 13.99
    sir_db: 14.14
    pathloss_db: 94.36
    distance_m: 86.94
    los_ratio: 0.413
    doppler_hz: 9.72
    srs_meas_sir_db: -9.88   # 测量已失效
    ms_per_sample: 1150
  config:
    source: internal_sim
    scenario: UMi_NLOS
    channel_model: CDL-C
    num_sites: 7
    sectors_per_site: 3
    isd_m: 200.0
    num_ues: 105
    num_interfering_ues: 24
    pusch_load: 1.0
    num_bs_tx_ant: 64
    num_bs_rx_ant: 64
    num_ue_tx_ant: 2
    num_ue_rx_ant: 4
    bandwidth_hz: 100000000.0
    subcarrier_spacing: 30000
    carrier_freq_hz: 3500000000.0
    link: BOTH
    channel_est_mode: ls_linear

# ===========================================================================
# 测量干扰场景（SRS / CSI-RS 导频域）
# ===========================================================================
# 这一组和上面那组是**两回事**：业务域 SINR 还过得去、测量域已经崩了，
# 是实网里最常见也最难查的一类问题——预编码用的是被污染的信道估计。
# 必须 link: BOTH（paired）才会产生 ul_sir_dB / dl_sir_dB 两列。

srs_congested:
  group: 测量干扰
  label: SRS 测量拥塞 · 邻区多 UE 同发、无序列跳变
  summary: 每个邻区 24 个 UE 同时发 SRS，comb=2、关掉组跳与序列跳，导频碰撞最严重。
  typical_for: [信道估计鲁棒性, SRS 容量, 导频污染, 上行 CSI 获取]
  verify: sw_interference_report 看 measurement_domain.ul_srs.sir_dB 中位数与 nmse_floor_db
  expect:   # 实测，63 样本 · sw_probe_scenario
    cells: 21
    iot_dl_db: 29.08      # 高干扰
    iot_ul_db: 1.06
    sinr_db: 15.57
    sir_db: 15.7
    pathloss_db: 92.76
    distance_m: 86.21
    los_ratio: 0.46
    doppler_hz: 9.72
    srs_meas_sir_db: -10.5   # 测量已失效
    ms_per_sample: 1333
  config:
    source: internal_sim
    scenario: UMi_NLOS
    channel_model: CDL-C
    num_sites: 7
    sectors_per_site: 3
    isd_m: 200.0
    num_ues: 21
    num_interfering_ues: 24
    srs_comb: 2
    srs_group_hopping: false
    srs_sequence_hopping: false
    srs_periodicity: 2
    num_bs_tx_ant: 64
    num_bs_rx_ant: 64
    num_ue_tx_ant: 2
    num_ue_rx_ant: 4
    bandwidth_hz: 100000000.0
    subcarrier_spacing: 30000
    carrier_freq_hz: 3500000000.0
    link: BOTH
    channel_est_mode: ls_linear

srs_clean_reference:
  group: 测量干扰
  label: SRS 测量干净对照 · 少 UE、comb 4、开组跳
  summary: 与 srs_congested 配对。邻区只有 2 个 UE 发 SRS，comb=4 并开组跳变。
  typical_for: [测量干扰对照, 消融实验]
  verify: 与 srs_congested 只差导频配置，两者 measurement_domain 之差就是导频方案的净效应
